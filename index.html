<!doctype html>

    <meta name="theme-color" content="#183244" />
    <meta name="application-name" content="YFLB Atlas" />
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem("professional-atlas-v3") || "null");
        const lang = /^\/ar(?:\/|$)/.test(location.pathname) || saved?.language === "ar" ? "ar" : "en";
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
        document.documentElement.dataset.theme = saved?.theme === "dark" ? "dark" : "light";
      } catch { /* Use the default English theme until app state is available. */ }
    </script>
    <meta name="description" content="Explore self-paced learning paths for business administration, accounting, finance, economics, data analytics, data engineering, information systems and professional skills." />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

    <a class="skip-link" href="#main-content" data-i18n="skip">Skip to main content</a>
    <div class="platform-shell">
      <header class="platform-header">
        <a class="platform-brand" href="/" aria-label="YFLB Atlas" data-i18n-aria="brandLabel">
          <img src="/assets/logos/YFLB-logo-white.svg" alt="Official YFLB logo" data-i18n-alt="brandAlt" />
          <span class="brand-divider" aria-hidden="true"></span>
          <span class="brand-name" data-i18n="brand">Atlas</span>
        </a>
        <nav class="platform-nav" aria-label="Main navigation" data-i18n-aria="primaryNav">
          <a href="/paths/" data-route="paths" data-i18n="navRoadmaps">Roadmaps</a>
          <a href="/learning/" data-route="learning" data-i18n="navLearning">My learning</a>
          <a href="/saved/" data-route="saved" data-i18n="navSaved">Saved</a>
          <a href="/admin/" data-route="admin" data-i18n="navAdmin" hidden>Edit content</a>
        </nav>
        <div class="platform-tools">
          <div class="search-wrap" id="searchWrap">
            <span class="search-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg></span>
            <input id="globalSearch" type="search" placeholder="What do you want to learn today?" aria-label="Search roadmaps and topics" data-i18n-placeholder="searchPlaceholder" data-i18n-aria="search" aria-controls="searchResults" aria-expanded="false" autocomplete="off" />
            <kbd aria-hidden="true">Ctrl K</kbd>
            <div class="search-results" id="searchResults" role="listbox" aria-label="Search results" data-i18n-aria="searchResults" hidden></div>
          </div>
          <div class="settings-control" id="settingsControl">
            <button class="icon-button settings-toggle" id="settingsToggle" type="button" data-action="settings-toggle" aria-label="Settings" data-i18n-aria="settings" aria-expanded="false" aria-controls="settingsPopover" aria-haspopup="true" title="Settings" data-i18n-title="settings">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1a1.7 1.7 0 0 1-2.4 2.4l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a1.7 1.7 0 0 1-3.4 0v-.2a1.7 1.7 0 0 0-2.9-1.2l-.1.1a1.7 1.7 0 0 1-2.4-2.4l.1-.1a1.7 1.7 0 0 0-1.2-2.9H4a1.7 1.7 0 0 1 0-3.4h.2a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a1.7 1.7 0 0 1 2.4-2.4l.1.1a1.7 1.7 0 0 0 2.9-1.2V2a1.7 1.7 0 0 1 3.4 0v.2a1.7 1.7 0 0 0 2.9 1.2l.1-.1a1.7 1.7 0 0 1 2.4 2.4l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.2a1.7 1.7 0 0 1 0 3.4h-.2a1.7 1.7 0 0 0-1.2 2.9Z"/></svg>
            </button>
            <section class="settings-popover" id="settingsPopover" aria-labelledby="settingsHeading" hidden>
              <h2 id="settingsHeading" data-i18n="settings">Settings</h2>
              <button class="settings-option" id="languageToggle" type="button" aria-label="Switch to Arabic" title="Switch to Arabic">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0-18"/></svg>
                <span class="settings-option-copy"><span class="settings-option-label" data-i18n="language">Language</span><strong id="languageToggleLabel">العربية</strong></span>
              </button>
              <button class="settings-option" id="themeToggle" type="button" aria-label="Switch to dark theme" title="Switch to dark theme">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l-1.41-1.41m12.14-11.25 1.41-1.41"/></svg>
                <span class="settings-option-copy"><span class="settings-option-label" data-i18n="appearance">Appearance</span><strong id="themeToggleLabel">Switch to dark theme</strong></span>
              </button>
              <button class="admin-edit-mode-toggle settings-admin-edit" id="adminEditModeButton" type="button" data-action="toggle-admin-edit-mode" aria-pressed="false" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg><span id="adminEditModeLabel">Edit roadmap</span></button>
              <div class="account-control settings-account" id="accountControl">
                <button class="account-button" id="accountButton" type="button" data-action="account-toggle" aria-expanded="false" aria-controls="accountPopover" aria-label="Sign in" data-i18n-aria="signIn"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M4.8 20a7.2 7.2 0 0 1 14.4 0"/></svg><span id="accountButtonLabel" data-i18n="signIn">Sign in</span></button>
                <span class="admin-badge account-admin-indicator" id="accountAdminIndicator" hidden data-i18n="adminBadge">Admin</span>
                <section class="account-popover" id="accountPopover" aria-label="Account" data-i18n-aria="account" hidden>
                  <strong class="account-email" id="accountEmail"></strong>
                  <span class="admin-badge" id="accountAdminBadge" hidden data-i18n="adminBadge">Admin</span>
                  <p class="account-sync-note" id="accountSyncNote"></p>
                  <button class="account-popover-action" type="button" data-action="account-signout" data-i18n="signOut">Sign out</button>
                </section>
              </div>
            </section>
          </div>
          <button class="icon-button compact-menu" id="menuToggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="platformNavMobile" data-i18n-aria="menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        </div>
      </header>
      <nav class="mobile-nav" id="platformNavMobile" aria-label="Main navigation" hidden>
        <a href="/paths/" data-route="paths" data-i18n="navRoadmaps">Roadmaps</a>

      </main>
      <footer class="platform-footer"><a class="footer-brand-lockup" href="/" aria-label="YFLB Atlas" data-i18n-aria="brandLabel"><span class="footer-logo-plate"><img class="footer-brand-logo" src="/assets/logos/YFLB-logo-black.svg" alt="" aria-hidden="true" /></span><span class="brand-divider" aria-hidden="true"></span><span class="brand-name" data-i18n="brand">Atlas</span></a><span data-i18n="sourceNote">A self-paced learning guide. It is not a degree or professional certification.</span></footer>
    </div>
